version: "3.9"

services:
  app:
    build:
      context: ./app
    working_dir: /app
    env_file:
      - .env
    expose:
      - '3000'
    restart: always
    command: npm run start

  redis:
    image: redis:latest
    expose:
      - '6379'
    restart: always

  nginx:
    container_name: proxy_nginx
    depends_on:
      - app
    image: nginx:latest
    ports:
      - '80:80'
    volumes:
      - ./nginx:/etc/nginx/conf.d
    restart: always
  client:  
    build:
      context: ./client
    ports:
      - 31337:31337
    volumes:
      - ./client:/client
    env_file:
      - .env
volumes:
  postgres:
  data:

networks:
  network: {}